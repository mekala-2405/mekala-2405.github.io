<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harsh Vardhan Reddy Mekala</title>
  <meta name="description" content="Portfolio of Harsh Vardhan Reddy Mekala, Developer and Robotics Engineer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet" />
  <!-- set theme before paint to avoid flash -->
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <div class="bg-fx"><span class="b1"></span><span class="b2"></span></div>
  <div id="preloader"><div class="pre-name display" id="preName"></div></div>
  <div class="cursor-ring"></div>
  <div class="cursor-dot"></div>
  <div id="progress"></div>

  <nav>
    <a href="#hero" class="nav-logo" data-cursor>HVR Mekala</a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="#about" data-cursor>About</a></li>
        <li><a href="#experience" data-cursor>Experience</a></li>
        <li><a href="#projects" data-cursor>Projects</a></li>
        <li><a href="#contact" data-cursor>Contact</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" data-cursor>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </nav>

  <div class="side side-left" id="sideLeft"></div>
  <div class="side side-right" id="sideRight"></div>

  <main id="app"></main>

  <footer>
    <div class="container">
      <span id="footerCopy"></span>
      <div class="footer-social" id="footerSocial"></div>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
